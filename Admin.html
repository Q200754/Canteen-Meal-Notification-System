<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRTC-CCIS | บันทึกข้อมูลการจัดเลี้ยง (Admin)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #f0f2f5; font-family: 'Prompt', sans-serif; }
    .login-card { max-width: 420px; margin: 80px auto auto; border-radius: 20px; border: none; }
  </style>
</head>
<body class="p-3 p-md-4">
  <div class="container" style="max-width: 800px;">
    <div id="authScreen" class="card login-card p-4 p-md-5 bg-white text-center shadow">
      <div class="mb-3 fs-1 text-primary">🔑</div>
      <h4 class="fw-bold mb-2">PRTC-CCIS Admin</h4>
      <p class="text-muted small mb-4">กรอกรหัส PIN เพื่อลงข้อมูล</p>
      <input type="password" id="pinInput" class="form-control text-center fs-3 fw-bold mb-3" maxlength="6" placeholder="••••" autofocus>
      <button class="btn btn-primary w-100 mb-2" onclick="loginAdmin()">เข้าสู่ระบบ</button>
      <a href="https://script.google.com/macros/s/AKfycbzeqdLsPcZMePUnknJ19NueWcP2ZJV9WnuCJuSaSI1pgLU62fgbNIGiw8a5yFXo-GiTPQ/exec" class="btn btn-link text-muted small text-decoration-none">← กลับหน้าตารางอาหาร</a>
    </div>

    <div id="adminPanel" style="display: none;">
      <div class="p-4 mb-4 bg-primary text-white rounded-3 shadow d-flex justify-content-between align-items-center">
        <h4 class="fw-bold mb-0">⚙️ ฟอร์มบันทึกข้อมูลการจัดเลี้ยง</h4>
        <a href="https://script.google.com/macros/s/AKfycbzeqdLsPcZMePUnknJ19NueWcP2ZJV9WnuCJuSaSI1pgLU62fgbNIGiw8a5yFXo-GiTPQ/exec" class="btn btn-outline-light btn-sm rounded-pill">หน้าตารางอาหาร</a>
      </div>

      <div class="card p-4 mb-4 bg-white shadow-sm border-0">
        <form id="adminForm" onsubmit="handleFormSubmit(event)">
          <input type="hidden" id="id" name="id">
          <div class="row g-3 mb-3">
            <div class="col-md-6"><label class="form-label">📅 วันที่จัดเลี้ยง *</label><input type="date" class="form-control" id="date" required></div>
            <div class="col-md-6"><label class="form-label">⏰ เวลาช่วงที่จัด *</label><input type="text" class="form-control" id="time" placeholder="เช่น 11:30 - 13:00 น." required></div>
          </div>
          <div class="mb-3"><label class="form-label">🎉 เนื่องในโอกาส / งาน *</label><input type="text" class="form-control" id="occasion" required></div>
          <div class="row g-3 mb-3">
            <div class="col-md-8"><label class="form-label">👤 ชื่อแขก / เจ้าภาพ *</label><input type="text" class="form-control" id="guestName" required></div>
            <div class="col-md-4"><label class="form-label">👥 จำนวนแขก (คน) *</label><input type="number" class="form-control" id="guestCount" min="1" required></div>
          </div>
          <div class="mb-3"><label class="form-label">🍱 รายการอาหารหลัก *</label><textarea class="form-control" id="mainMenu" rows="2" required></textarea></div>
          <div class="mb-3"><label class="form-label">🍦 ของกินเล่น / ของหวาน</label><input type="text" class="form-control" id="snackDessert"></div>
          <div class="mb-3">
            <label class="form-label">📌 สถานะการยืนยัน *</label>
            <select class="form-select" id="guestStatus">
              <option value="มา">✅ มา (ยืนยันแล้ว)</option>
              <option value="รอยืนยัน">⏳ รอยืนยัน</option>
              <option value="ไม่มา/ยกเลิก">❌ ไม่มา / ยกเลิก</option>
            </select>
          </div>
          <button type="submit" id="btnSubmit" class="btn btn-primary w-100">💾 บันทึกข้อมูล</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let currentPin = '';
    function loginAdmin() {
      const pin = document.getElementById('pinInput').value;
      google.script.run.withSuccessHandler(isValid => {
        if (isValid) {
          currentPin = pin;
          document.getElementById('authScreen').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'block';
          document.getElementById('date').value = new Date().toISOString().split('T')[0];
        } else { alert('รหัส PIN ไม่ถูกต้อง!'); }
      }).checkAdminPin(pin);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      const formData = {
        id: document.getElementById('id').value,
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        occasion: document.getElementById('occasion').value,
        guestName: document.getElementById('guestName').value,
        guestCount: document.getElementById('guestCount').value,
        mainMenu: document.getElementById('mainMenu').value,
        snackDessert: document.getElementById('snackDessert').value,
        guestStatus: document.getElementById('guestStatus').value
      };
      google.script.run.withSuccessHandler(res => {
        alert(res.message);
        if (res.success) document.getElementById('adminForm').reset();
        btn.disabled = false;
      }).saveCanteenEvent(formData, currentPin);
    }
  </script>
</body>
</html>
